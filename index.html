<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time weather dashboard with 5-day forecasts and statistics">
  <title>Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
  </div>

  <div class="container">
    <header class="app-header">
      <div class="app-header__brand">
        <svg class="app-header__icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
        <h1>Weather Dashboard</h1>
      </div>

      <div class="search-section" role="search">
        <div class="search-section__input-wrapper">
          <svg class="search-section__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input
            type="text"
            id="city-input"
            placeholder="Search for a city..."
            autocomplete="off"
            aria-label="City name"
          />
        </div>
        <button id="search-btn" aria-label="Search weather" type="button">
          <span>Search</span>
        </button>
      </div>
    </header>

    <div id="loading" class="loading hidden" role="status" aria-label="Loading weather data">
      <div class="loading__skeleton-grid">
        <div class="skeleton skeleton--wide"></div>
        <div class="skeleton skeleton--medium"></div>
        <div class="skeleton skeleton--medium"></div>
        <div class="skeleton skeleton--narrow"></div>
        <div class="skeleton skeleton--narrow"></div>
        <div class="skeleton skeleton--narrow"></div>
      </div>
      <p class="loading__text">Fetching weather data...</p>
    </div>

    <div id="error" class="error-message hidden" role="alert">
      <svg class="error-message__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
      </svg>
      <span id="error-text"></span>
    </div>

    <main id="dashboard" class="dashboard hidden">
      <section class="card card--current" aria-labelledby="city-name">
        <div class="card__header">
          <div class="card__header-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            <h2 id="city-name"></h2>
          </div>
          <time id="current-time" class="card__timestamp"></time>
        </div>

        <div class="card__body">
          <div class="weather-main">
            <img id="weather-icon" src="" alt="" class="weather-main__icon" />
            <div class="weather-main__temp">
              <span id="temperature"></span>
              <span class="weather-main__unit">°</span>
            </div>
            <p id="description" class="weather-main__desc"></p>
          </div>

          <div class="weather-details">
            <div class="weather-details__item">
              <div class="weather-details__icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><path d="M8.5 8.5v.01"/><path d="M16 15.5v.01"/><path d="M12 12v.01"/>
                </svg>
              </div>
              <div class="weather-details__content">
                <span class="weather-details__label">Feels Like</span>
                <span id="feels-like" class="weather-details__value"></span>
              </div>
            </div>

            <div class="weather-details__item">
              <div class="weather-details__icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2v2"/><path d="m17 5.15-1.5 1.5"/><path d="m19 12h2"/><path d="m17 18.85-1.5-1.5"/><path d="M12 22v-2"/><path d="m7 18.85-1.5 1.5"/><path d="M12 12a4 4 0 0 0 0-8 4 4 0 0 0 0 8Z"/><path d="m5.15 7 1.5 1.5"/><path d="M3 12h2"/>
                </svg>
              </div>
              <div class="weather-details__content">
                <span class="weather-details__label">Humidity</span>
                <span id="humidity" class="weather-details__value"></span>
              </div>
            </div>

            <div class="weather-details__item">
              <div class="weather-details__icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.7 7.7a7.5 7.5 0 1 0 0 8.6"/><path d="M22 12h-4"/><path d="m20 8 4 4-4 4"/>
                </svg>
              </div>
              <div class="weather-details__content">
                <span class="weather-details__label">Wind Speed</span>
                <span id="wind-speed" class="weather-details__value"></span>
              </div>
            </div>

            <div class="weather-details__item">
              <div class="weather-details__icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2v10"/><path d="M12 12 8 8"/><path d="M12 12l4-4"/><path d="M21 15a3 3 0 0 1-3 3H6a3 3 0 0 1 0-6h1"/>
                </svg>
              </div>
              <div class="weather-details__content">
                <span class="weather-details__label">Pressure</span>
                <span id="pressure" class="weather-details__value"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="card card--forecast" aria-labelledby="forecast-heading">
        <div class="card__title-row">
          <h2 id="forecast-heading">5-Day Forecast</h2>
          <div class="card__title-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>
            </svg>
          </div>
        </div>
        <div id="forecast-container" class="forecast-grid"></div>
      </section>

      <section class="card card--stats" aria-labelledby="stats-heading">
        <div class="card__title-row">
          <h2 id="stats-heading">Analytics</h2>
          <div class="card__title-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
            </svg>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--avg">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
              </svg>
            </div>
            <span class="stat-card__label">Average Temp</span>
            <span id="avg-temp" class="stat-card__value"></span>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--high">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m18 15-6-6-6 6"/>
              </svg>
            </div>
            <span class="stat-card__label">Highest Temp</span>
            <span id="max-temp" class="stat-card__value"></span>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--low">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </div>
            <span class="stat-card__label">Lowest Temp</span>
            <span id="min-temp" class="stat-card__value"></span>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--data">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
              </svg>
            </div>
            <span class="stat-card__label">Data Points</span>
            <span id="data-points" class="stat-card__value"></span>
          </div>
        </div>
      </section>

      <section class="card card--chart" aria-labelledby="chart-heading">
        <div class="card__title-row">
          <h2 id="chart-heading">Weather Trends</h2>
          <div class="chart-controls">
            <div class="range-toggle" role="radiogroup" aria-label="Time range">
              <button class="range-toggle__btn range-toggle__btn--active" data-range="7" type="button">7D</button>
              <button class="range-toggle__btn" data-range="14" type="button">14D</button>
              <button class="range-toggle__btn" data-range="30" type="button">30D</button>
            </div>
            <div class="chart-legend">
              <span class="chart-legend__item">
                <span class="chart-legend__dot chart-legend__dot--high"></span> High
              </span>
              <span class="chart-legend__item">
                <span class="chart-legend__dot chart-legend__dot--low"></span> Low
              </span>
            </div>
          </div>
        </div>
        <div id="chart-loading" class="chart-loading hidden">
          <div class="chart-loading__spinner"></div>
        </div>
        <div class="chart-wrapper">
          <canvas id="weather-chart"></canvas>
          <p id="chart-no-data" class="chart-no-data hidden">Select a time range to view trends</p>
        </div>
      </section>

      <footer class="app-footer">
        <p>Powered by <a href="https://open-meteo.com" target="_blank" rel="noopener noreferrer">Open-Meteo API</a></p>
      </footer>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
